<!DOCTYPE html>
<html>
<body>
  <h1>Socket.IO Test</h1>
  <div id="log"></div>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    // Since Socket.IO connections don't go through your Express requireAuth middleware automatically, we pass the JWT (if it exists) during the handshake instead.
    // io(...) is a Socket.io request to the server. So it must carry the JWT in the auth object.
    const socket = io('http://localhost:3000' , {
      withCredentials: true,  // This tells Socket.IO to send cookies(accessToken and refreshToken) with the request (when httpOnly cookies are used)
    });

    const log = document.getElementById('log');

    socket.on('connect', () => {
      log.innerHTML += '<p>Connected!</p>';
    });

    socket.on('todo:created', (todo) => {
      log.innerHTML += '<p>New todo: ' + JSON.stringify(todo) + '</p>';
    });

    socket.on('todo:updated', (todo) => {
      log.innerHTML += '<p>Updated todo: ' + JSON.stringify(todo) + '</p>';
    });

    socket.on('todo:deleted', (data) => {
      log.innerHTML += '<p>Deleted todo id: ' + data.id + '</p>';
    });
  </script>
</body>
</html>
