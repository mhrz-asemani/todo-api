<!DOCTYPE html>
<html>
<body>
  <h1>Socket.IO Test</h1>
  <div id="log"></div>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const socket = io('http://localhost:3000');
    const log = document.getElementById('log');

    socket.on('connect', () => {
      log.innerHTML += '<p>Connected!</p>';
    });

    socket.on('todo:created', (todo) => {
      log.innerHTML += '<p>New todo: ' + JSON.stringify(todo) + '</p>';
    });

    socket.on('todo:updated', (todo) => {
      log.innerHTML += '<p>Updated todo: ' + JSON.stringify(todo) + '</p>';
    });

    socket.on('todo:deleted', (data) => {
      log.innerHTML += '<p>Deleted todo id: ' + data.id + '</p>';
    });
  </script>
</body>
</html>
