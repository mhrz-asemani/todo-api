<!DOCTYPE html>
<html>
<body>
  <h1>Socket.IO Test</h1>
  <div id="log"></div>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    // we need the socket to know which user it belongs to. Since Socket.IO connections don't go through your Express requireAuth middleware automatically, we pass the JWT during the handshake instead.
    // io(...) is a Socket.io request to the server. So it must carry the JWT in the auth object.
    const socket = io('http://localhost:3000' , {
      auth: {token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjEsImlhdCI6MTc4NTk1MDY0NSwiZXhwIjoxNzg1OTU0MjQ1fQ.DTG1fdqP2QxADX3P_R9r7D3qB4vL178zIiyoxwv-CSo"}
    });
    const log = document.getElementById('log');

    socket.on('connect', () => {
      log.innerHTML += '<p>Connected!</p>';
    });

    socket.on('todo:created', (todo) => {
      log.innerHTML += '<p>New todo: ' + JSON.stringify(todo) + '</p>';
    });

    socket.on('todo:updated', (todo) => {
      log.innerHTML += '<p>Updated todo: ' + JSON.stringify(todo) + '</p>';
    });

    socket.on('todo:deleted', (data) => {
      log.innerHTML += '<p>Deleted todo id: ' + data.id + '</p>';
    });
  </script>
</body>
</html>
